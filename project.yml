name: Cuponeame
options:
  bundleIdPrefix: com.bpo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9ZMNPYL827
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Cuponeame:
    type: application
    platform: iOS
    sources:
      - path: cuponeame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bpo.cuponeame
        CODE_SIGN_ENTITLEMENTS: cuponeame/Cuponeame.entitlements
    info:
      path: cuponeame/Info.plist
      properties:
        CFBundleDisplayName: Cuponéame
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App solo en español: alertas y hojas del sistema en español.
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GID_REVERSED_CLIENT_ID)
        UIBackgroundModes:
          - remote-notification
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: Kingfisher
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: CuponWidget
        embed: true

  CuponWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CuponWidget
      # El snapshot del App Group se compila en app y widget.
      - path: cuponeame/Shared/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bpo.cuponeame.widget
        CODE_SIGN_ENTITLEMENTS: CuponWidget/CuponWidget.entitlements
    info:
      path: CuponWidget/Info.plist
      properties:
        CFBundleDisplayName: Cuponéame
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CuponeameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: cuponeameTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Cuponeame

  CuponeameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: cuponeameUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Cuponeame

schemes:
  Cuponeame:
    build:
      targets:
        Cuponeame: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CuponeameTests
