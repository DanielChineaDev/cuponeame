    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: Kingfisher
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: CuponWidget
        embed: true

  CuponWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CuponWidget
      # El snapshot del App Group se compila en app y widget.
      - path: cuponeame/Shared/WidgetSnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bpo.cuponeame.widget
        CODE_SIGN_ENTITLEMENTS: CuponWidget/CuponWidget.entitlements
    info:
      path: CuponWidget/Info.plist
      properties:
        CFBundleDisplayName: Cuponéame
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  CuponeameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: cuponeameTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Cuponeame

  CuponeameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: cuponeameUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Cuponeame

schemes:
  Cuponeame:
    build:
      targets:
        Cuponeame: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CuponeameTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
