name: Cuponeame
options:
  bundleIdPrefix: com.bpo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9ZMNPYL827
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0

targets:
  Cuponeame:
    type: application
    platform: iOS
    sources:
      - path: cuponeame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bpo.cuponeame
        CODE_SIGN_ENTITLEMENTS: cuponeame/Cuponeame.entitlements
      configs:
        # APNs: sandbox en desarrollo, producción en los builds de App Store.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: cuponeame/Info.plist
      properties:
        CFBundleDisplayName: Cuponéame
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # App solo en español: alertas y hojas del sistema en español.
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GID_REVERSED_CLIENT_ID)
        UIBackgroundModes:
          - remote-notification
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ADMOB_INTERSTITIAL_UNIT: $(ADMOB_INTERSTITIAL_UNIT)
        ADMOB_REWARDED_UNIT: $(ADMOB_REWARDED_UNIT)
        ADMOB_BANNER_UNIT: $(ADMOB_BANNER_UNIT)
        NSUserTrackingUsageDescription: Usamos este permiso para mostrarte anuncios más relevantes. Puedes decir que no y la app funciona igual.
        NSPhotoLibraryUsageDescription: Elige una foto de tu galería para ponerla como imagen de un cupón.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
